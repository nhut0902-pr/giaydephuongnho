<!DOCTYPE html>
<html lang="vi">

<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="/images/logo.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn Hàng - Giày Dép Hương Nhớ</title>
    <link rel="icon" href="/favicon.jpg" type="image/jpeg">
    <link rel="stylesheet" href="css/style.css?v=6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header class="header">
        <div class="header-container">
            <a href="/" class="logo"><img src="images/logo.jpg" alt="Giày Dép Hương Nhớ"></a>
            <nav class="nav"><a href="/">Trang Chủ</a><a href="/products.html">Sản Phẩm</a><a href="/blog.html">Bảng
                    Tin</a></nav>
            <div class="header-actions">
                <button class="cart-btn" onclick="toggleCart()"><i class="fas fa-shopping-bag"></i><span
                        class="cart-count" id="cart-count">0</span></button>
                <div id="auth-section"></div>
            </div>
        </div>
    </header>

    <div class="page-header">
        <h1><i class="fas fa-box"></i> Đơn Hàng Của Tôi</h1>
    </div>

    <div class="orders-list" id="orders-list">
        <div class="loading">
            <div class="spinner"></div>
        </div>
    </div>

    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3><i class="fas fa-shopping-bag"></i> Giỏ Hàng</h3><button class="modal-close" onclick="toggleCart()"><i
                    class="fas fa-times"></i></button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total"><span>Tổng:</span><span id="cart-total">0đ</span></div><a href="/cart.html"
                class="btn btn-primary btn-block">Xem Giỏ Hàng</a>
        </div>
    </div>
    <div class="modal-overlay" id="cart-overlay" onclick="toggleCart()"></div>
    <div class="toast-container" id="toast-container"></div>

    <script src="js/api.js?v=5"></script>
    <script src="js/auth.js?v=3"></script>
    <script src="js/cart.js?v=3"></script>
    <script src="js/main.js?v=9"></script>
    <script>document.addEventListener('DOMContentLoaded', initPolicyNotice);</script>
    <script>
        const statusLabels = {
            pending: 'Chờ xác nhận',
            processing: 'Đang xử lý',
            shipped: 'Đang giao',
            delivered: 'Đã giao',
            cancelled: 'Đã hủy'
        };

        async function loadOrders() {
            if (!isLoggedIn()) {
                sessionStorage.setItem('redirectAfterLogin', '/orders.html');
                window.location.href = '/login.html';
                return;
            }

            const container = document.getElementById('orders-list');

            try {
                const orders = await ordersAPI.getAll();

                if (orders.length === 0) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-box-open"></i><h3>Chưa có đơn hàng</h3><p>Hãy mua sắm ngay!</p><a href="/products.html" class="btn btn-primary">Xem sản phẩm</a></div>';
                    return;
                }

                container.innerHTML = orders.map(order => `
          <div class="order-card">
            <div class="order-header">
              <div>
                <span class="order-id">Đơn hàng #${order.id}</span>
                <span class="order-date" style="margin-left:1rem">${formatDate(order.createdAt)}</span>
              </div>
              <span class="order-status status-${order.status}">${statusLabels[order.status]}</span>
            </div>
            <div class="order-body">
              <div class="order-items">
                ${order.OrderItems.map(item => `
                  <div class="order-item">
                    <div class="order-item-image"><img src="${item.productImage || ''}" alt="${item.productName}"></div>
                    <div style="flex:1">
                      <div style="font-weight:500">${item.productName}</div>
                      <div style="color:var(--gray)">SL: ${item.quantity} x ${formatPrice(item.price)}</div>
                    </div>
                    <div style="font-weight:600">${formatPrice(item.quantity * item.price)}</div>
                  </div>
                `).join('')}
              </div>
              ${order.discount > 0 ? `<div style="color:var(--success);margin-bottom:0.5rem">Giảm giá: -${formatPrice(order.discount)}</div>` : ''}
              <div class="order-total">
                <span>Tổng cộng:</span>
                <span style="color:var(--primary-dark)">${formatPrice(order.total)}</span>
              </div>
              <div style="margin-top:1rem;display:flex;gap:0.5rem;flex-wrap:wrap">
                ${order.status === 'pending' ? `<button class="btn btn-danger" onclick="cancelOrder(${order.id})"><i class="fas fa-times"></i> Hủy đơn</button>` : ''}
                <button class="btn btn-secondary" onclick="downloadInvoice(${order.id})"><i class="fas fa-file-pdf"></i> Tải hóa đơn</button>
                ${getReturnButtonHtml(order)}
              </div>
            </div>
          </div>
        `).join('');
            } catch (error) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Lỗi tải đơn hàng</h3></div>';
            }
        }

        async function cancelOrder(id) {
            if (!confirm('Bạn có chắc muốn hủy đơn hàng này?')) return;
            try {
                await ordersAPI.cancel(id);
                showToast('Đã hủy đơn hàng', 'success');
                loadOrders();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        function downloadInvoice(orderId) {
            const token = localStorage.getItem('token');
            // Open in new window with auth header via form submission
            const link = document.createElement('a');
            link.href = `${API_URL}/invoice/${orderId}?token=${token}`;
            link.download = `hoadon-${orderId}.pdf`;
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('Đang tải hóa đơn...', 'success');
        }

        function getReturnButtonHtml(order) {
            if (order.returnStatus === 'requested') {
                return '<span style="color:#f59e0b;font-weight:600;display:inline-flex;align-items:center;padding:0.4rem 1rem;border-radius:8px;background:#fef3c7"><i class="fas fa-clock" style="margin-right:0.3rem"></i> Đang chờ duyệt đổi trả</span>';
            }
            if (order.returnStatus === 'approved') {
                return '<span style="color:#10b981;font-weight:600;display:inline-flex;align-items:center;padding:0.4rem 1rem;border-radius:8px;background:#d1fae5"><i class="fas fa-check-circle" style="margin-right:0.3rem"></i> Đổi trả thành công</span>';
            }
            if (order.returnStatus === 'rejected') {
                return '<span style="color:#ef4444;font-weight:600;display:inline-flex;align-items:center;padding:0.4rem 1rem;border-radius:8px;background:#fee2e2"><i class="fas fa-times-circle" style="margin-right:0.3rem"></i> Đổi trả bị từ chối</span>';
            }

            if (order.status === 'delivered') {
                const deliveredAt = new Date(order.updatedAt);
                const daysDiff = (new Date() - deliveredAt) / (1000 * 60 * 60 * 24);
                if (daysDiff <= 7) {
                    return `<button class="btn btn-primary" onclick="requestReturn(${order.id})" style="background:#f59e0b;color:white;border:none"><i class="fas fa-exchange-alt"></i> Yêu cầu đổi trả</button>`;
                } else {
                    return '<span style="color:#888;font-size:0.9rem;display:inline-flex;align-items:center;padding:0.5rem"><i class="fas fa-info-circle" style="margin-right:0.3rem"></i> Quá hạn đổi trả (7 ngày)</span>';
                }
            }
            return '';
        }

        async function requestReturn(id) {
            const reason = prompt('Vui lòng nhập lý do yêu cầu đổi trả hàng:');
            if (reason === null) return; // User cancelled
            if (!reason.trim()) {
                showToast('Vui lòng nhập lý do đổi trả', 'error');
                return;
            }

            try {
                await ordersAPI.requestReturn(id, reason.trim());
                showToast('Đã gửi yêu cầu đổi trả thành công', 'success');
                loadOrders(); // Reload to update button state
            } catch (error) {
                showToast(error.message || 'Lỗi gửi yêu cầu đổi trả', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
    <script src="/js/push-client.js?v=6"></script>
</body>

</html>
