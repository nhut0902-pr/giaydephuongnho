<!DOCTYPE html>
<html lang="vi">

<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="/images/logo.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Viết - Giày Dép Hương Nhớ</title>
    <link rel="icon" href="/favicon.jpg" type="image/jpeg">
    <link rel="stylesheet" href="css/style.css?v=6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .blog-detail {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .blog-detail-header {
            margin-bottom: 2rem;
        }

        .blog-detail-category {
            display: inline-block;
            background: #f3e8ff;
            color: #A948C8;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .blog-detail-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: #1A1135;
            margin: 0 0 1rem;
            line-height: 1.3;
        }

        .blog-detail-meta {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            color: #888;
            font-size: 0.88rem;
            margin-bottom: 1.5rem;
        }

        .blog-detail-meta i {
            margin-right: 0.3rem;
            color: #A948C8;
        }

        .blog-detail-thumbnail {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 2rem;
        }

        .blog-detail-content {
            color: #333;
            font-size: 1rem;
            line-height: 1.85;
        }

        .blog-detail-content p {
            margin-bottom: 1rem;
        }

        .blog-detail-content h2,
        .blog-detail-content h3 {
            color: #1A1135;
            margin: 1.5rem 0 0.75rem;
        }

        .blog-detail-content img {
            max-width: 100%;
            border-radius: 12px;
            margin: 1rem 0;
        }

        .blog-detail-content a {
            color: #A948C8;
        }

        .blog-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #A948C8;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .blog-back:hover {
            text-decoration: underline;
        }

        .blog-share {
            display: flex;
            gap: 0.75rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #f0f0f0;
        }

        .blog-share span {
            color: #888;
            font-size: 0.9rem;
        }

        .share-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            text-decoration: none;
            transition: all 0.2s;
        }

        .share-btn:hover {
            border-color: #A948C8;
            color: #A948C8;
        }

        @media (max-width: 600px) {
            .blog-detail-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header-container">
            <a href="/" class="logo"><img src="images/logo.jpg" alt="Giày Dép Hương Nhớ"></a>
            <nav class="nav"><a href="/">Trang Chủ</a><a href="/products.html">Sản Phẩm</a><a href="/blog.html">Bảng
                    Tin</a></nav>
            <div class="header-actions">
                <button class="cart-btn" onclick="toggleCart()"><i class="fas fa-shopping-bag"></i><span
                        class="cart-count" id="cart-count">0</span></button>
                <div id="auth-section"></div>
            </div>
        </div>
    </header>

    <div class="blog-detail" id="blog-detail">
        <div class="loading">
            <div class="spinner"></div>
        </div>
    </div>

    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3><i class="fas fa-shopping-bag"></i> Giỏ Hàng</h3><button class="modal-close" onclick="toggleCart()"><i
                    class="fas fa-times"></i></button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total"><span>Tổng:</span><span id="cart-total">0đ</span></div><a href="/cart.html"
                class="btn btn-primary btn-block">Xem Giỏ Hàng</a>
        </div>
    </div>
    <div class="modal-overlay" id="cart-overlay" onclick="toggleCart()"></div>
    <div class="toast-container" id="toast-container"></div>

    <script src="js/api.js?v=5"></script>
    <script src="js/auth.js?v=3"></script>
    <script src="js/cart.js?v=3"></script>
    <script src="js/main.js?v=9"></script>
    <script>document.addEventListener('DOMContentLoaded', initPolicyNotice);</script>
    <script>
        async function loadBlogDetail() {
            const slug = new URLSearchParams(window.location.search).get('slug');
            if (!slug) { window.location.href = '/blog.html'; return; }

            try {
                const post = await blogAPI.getBySlug(slug);
                document.title = `${post.title} - Giày Dép Hương Nhớ`;

                const url = encodeURIComponent(window.location.href);
                const title = encodeURIComponent(post.title);

                document.getElementById('blog-detail').innerHTML = `
                    <a href="/blog.html" class="blog-back"><i class="fas fa-arrow-left"></i> Quay lại Bảng Tin</a>
                    <div class="blog-detail-header">
                        <span class="blog-detail-category">${post.category || 'Tin tức'}</span>
                        <h1 class="blog-detail-title">${post.title}</h1>
                        <div class="blog-detail-meta">
                            <span><i class="fas fa-user"></i>${post.authorName}</span>
                            <span><i class="fas fa-calendar"></i>${new Date(post.createdAt).toLocaleDateString('vi-VN', { year: 'numeric', month: 'long', day: 'numeric' })}</span>
                            <span><i class="fas fa-eye"></i>${post.views || 0} lượt xem</span>
                        </div>
                    </div>
                    ${post.thumbnail ? `<img class="blog-detail-thumbnail" src="${post.thumbnail}" alt="${post.title}">` : ''}
                    <div class="blog-detail-content">${post.content}</div>
                    <div class="blog-share">
                        <span>Chia sẻ:</span>
                        <a class="share-btn" href="https://www.facebook.com/sharer/sharer.php?u=${url}" target="_blank" title="Facebook"><i class="fab fa-facebook-f"></i></a>
                        <a class="share-btn" href="https://twitter.com/intent/tweet?url=${url}&text=${title}" target="_blank" title="Twitter"><i class="fab fa-twitter"></i></a>
                        <a class="share-btn" href="#" onclick="navigator.clipboard.writeText(window.location.href);showToast('Đã sao chép link!','success');return false;" title="Sao chép link"><i class="fas fa-link"></i></a>
                    </div>
                `;
            } catch (error) {
                document.getElementById('blog-detail').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Bài viết không tồn tại</h3><a href="/blog.html" class="btn btn-primary">Xem bài viết khác</a></div>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadBlogDetail);
    </script>
    <script src="/js/push-client.js?v=6"></script>
</body>

</html>
