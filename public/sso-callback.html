<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSO Login | Giày Dép Hương Nhớ</title>
<style>
body{font-family:system-ui,sans-serif;background:#f5f5f5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#fff;border-radius:12px;padding:40px;box-shadow:0 2px 10px rgba(0,0,0,.1);max-width:400px;text-align:center}
.spinner{border:3px solid #f3f3f3;border-top:3px solid #007bff;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.ok{color:#28a745;font-size:48px}.err{color:#dc3545;font-size:48px}
</style>
</head>
<body>
<div class="card">
<h2>Đăng nhập SSO</h2>
<div id="content">
<div class="spinner"></div>
<p>Đang xác thực với NhutCoder Team...</p>
</div>
</div>
<script>
const API_URL = window.API_URL || 'https://giaydephuongnho-api.lamminhnhut09022011.workers.dev/api';
async function handleSSO() {
    try {
        const resp = await fetch(API_URL + '/auth/nct-sso', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({})
        });
        const data = await resp.json();
        if (data.token) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            document.getElementById('content').innerHTML = '<div class="ok">✅</div><p>Đăng nhập thành công!</p><p>Đang chuyển hướng...</p>';
            setTimeout(() => { window.location.href = '/'; }, 1500);
        } else {
            document.getElementById('content').innerHTML = '<div class="err">❌</div><p>' + (data.error || 'Đăng nhập thất bại') + '</p>';
        }
    } catch (err) {
        document.getElementById('content').innerHTML = '<div class="err">❌</div><p>Lỗi: ' + err.message + '</p>';
    }
}
handleSSO();
</script>
</body>
</html>
