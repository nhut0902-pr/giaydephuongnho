<!DOCTYPE html>
<html lang="vi">

<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="/images/logo.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sản Phẩm - Admin</title>
    <link rel="icon" href="/favicon.jpg" type="image/jpeg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="admin-layout">
        <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
        <aside class="admin-sidebar" id="admin-sidebar">
            <div class="admin-logo">
                <span class="admin-close-btn" onclick="toggleSidebar()"
                    style="display:none;cursor:pointer;margin-right:10px"><i class="fas fa-times"></i></span>
                👟 Admin Panel
            </div>
            <nav class="admin-nav">
                <a href="/admin/"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="/admin/orders.html"><i class="fas fa-shopping-cart"></i> Đơn Hàng</a>
                <a href="/admin/products.html" class="active"><i class="fas fa-box"></i> Sản Phẩm</a>
                <a href="/admin/discounts.html"><i class="fas fa-tags"></i> Mã Giảm Giá</a>
                <a href="/admin/flash-sale.html"><i class="fas fa-bolt"></i> Flash Sale</a>
                <a href="/admin/marketing.html"><i class="fas fa-bullhorn"></i> Marketing Event</a>
                <a href="/admin/blog.html"><i class="fas fa-newspaper"></i> Blog / Bảng Tin</a>
                <a href="/admin/users.html"><i class="fas fa-users"></i> Người Dùng</a>
                <a href="/"><i class="fas fa-store"></i> Xem Shop</a>
                <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng Xuất</a>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="admin-header">
                <div style="display:flex;align-items:center">
                    <i class="fas fa-bars admin-toggle" onclick="toggleSidebar()" style="display:none"></i>
                    <h1>Quản Lý Sản Phẩm</h1>
                </div>
                <button class="btn btn-primary" onclick="showAddModal()"><i class="fas fa-plus"></i> Thêm Sản
                    Phẩm</button>
            </div>

            <div class="admin-table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Hình</th>
                            <th>Tên</th>
                            <th>Danh mục</th>
                            <th>Giá</th>
                            <th>Kho</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Product Modal -->
    <div class="modal-overlay" id="product-modal" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modal-title">Thêm Sản Phẩm</h2><button class="modal-close" onclick="closeModal()"><i
                        class="fas fa-times"></i></button>
            </div>
            <form id="product-form" onsubmit="saveProduct(event)">
                <input type="hidden" id="product-id">
                <div class="form-group"><label>Tên sản phẩm *</label><input type="text" id="p-name" required></div>
                <div class="form-group"><label>Mô tả</label><textarea id="p-desc" rows="3"></textarea></div>
                <div class="form-group"><label>Giá (VNĐ) *</label><input type="number" id="p-price" required min="0">
                </div>

                <!-- Image Upload -->
                <div class="form-group">
                    <label>Hình ảnh sản phẩm</label>
                    <div style="display:flex;gap:1rem;align-items:center;margin-bottom:0.5rem">
                        <img id="p-image-preview" src="https://via.placeholder.com/100"
                            style="width:100px;height:100px;object-fit:cover;border-radius:8px;border:2px dashed #ddd">
                        <div style="flex:1">
                            <input type="file" id="p-image-file" accept="image/*" style="display:none"
                                onchange="uploadImage(this)">
                            <button type="button" class="btn btn-secondary"
                                onclick="document.getElementById('p-image-file').click()" id="upload-btn">
                                <i class="fas fa-upload"></i> Tải ảnh lên
                            </button>
                            <p style="font-size:0.8rem;color:var(--gray);margin-top:0.5rem">Hoặc nhập URL:</p>
                        </div>
                    </div>
                    <input type="url" id="p-image" placeholder="https://ik.imagekit.io/..."
                        onchange="previewUrl(this.value)">
                </div>

                <div class="form-group"><label>Danh mục</label>
                    <select id="p-category">
                        <option value="">Chọn danh mục</option>
                        <option value="sneaker">Sneaker</option>
                        <option value="sandal">Sandal</option>
                        <option value="sport">Thể Thao</option>
                        <option value="heels">Cao Gót</option>
                        <option value="loafer">Giày Lười</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Sizes (cách nhau bằng dấu phẩy)</label>
                    <input type="text" id="p-sizes" placeholder="VD: 39, 40, 41, 42">
                </div>
                <div class="form-group">
                    <label>Colors (cách nhau bằng dấu phẩy)</label>
                    <input type="text" id="p-colors" placeholder="VD: Đỏ, Xanh, Đen">
                </div>
                <div class="form-group"><label>Số lượng kho</label><input type="number" id="p-stock" min="0" value="0">
                </div>

                <!-- Multiple Images Section -->
                <div class="form-group">
                    <label>Thư viện ảnh sản phẩm</label>
                    <div style="margin-bottom:1rem">
                        <input type="file" id="p-images-files" accept="image/*" multiple style="display:none"
                            onchange="uploadMultipleImages(this)">
                        <button type="button" class="btn btn-secondary"
                            onclick="document.getElementById('p-images-files').click()" id="upload-multiple-btn">
                            <i class="fas fa-images"></i> Tải nhiều ảnh
                        </button>
                        <span style="font-size:0.8rem;color:var(--gray);margin-left:1rem">Tối đa 10 ảnh</span>
                    </div>
                    <div id="images-gallery" class="images-gallery">
                        <!-- Multiple images will be displayed here -->
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Lưu</button>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="../js/api.js?v=4"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
        async function loadProducts() {
            if (!(await requireAdmin())) return;

            try {
                const products = await productsAPI.getAll();
                document.getElementById('products-tbody').innerHTML = products.map(p => `
          <tr>
            <td>
              <img src="${p.image || 'https://via.placeholder.com/50'}" alt="${p.name}">
              ${p.images && p.images.length > 0 ? `
                <div class="product-images-preview">
                  ${p.images.slice(0, 3).map(img => `<img src="${img.url}" alt="Gallery">`).join('')}
                  ${p.images.length > 3 ? `<span style="font-size:0.7rem;color:var(--gray)">+${p.images.length - 3}</span>` : ''}
                </div>
              ` : ''}
            </td>
            <td>${p.name}</td>
            <td>${p.category || '-'}</td>
            <td>${formatPrice(p.price)}</td>
            <td>${p.stock}</td>
            <td>
              <button class="btn btn-secondary" style="padding:0.25rem 0.5rem" onclick="editProduct(${p.id})"><i class="fas fa-edit"></i></button>
              <button class="btn btn-danger" style="padding:0.25rem 0.5rem" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i></button>
            </td>
          </tr>
        `).join('') || '<tr><td colspan="6" style="text-align:center">Chưa có sản phẩm</td></tr>';
            } catch (error) { showToast('Lỗi tải sản phẩm', 'error'); }
        }

        function showAddModal() {
            document.getElementById('modal-title').textContent = 'Thêm Sản Phẩm';
            document.getElementById('product-form').reset();
            document.getElementById('product-id').value = '';
            document.getElementById('p-sizes').value = '';
            document.getElementById('p-colors').value = '';
            productImages = []; // Reset images
            renderImagesGallery();
            document.getElementById('product-modal').classList.add('active');
        }

        async function editProduct(id) {
            try {
                const p = await productsAPI.getById(id);
                document.getElementById('modal-title').textContent = 'Sửa Sản Phẩm';
                document.getElementById('product-id').value = id;
                document.getElementById('p-name').value = p.name;
                document.getElementById('p-desc').value = p.description || '';
                document.getElementById('p-price').value = p.price;
                document.getElementById('p-image').value = p.image || '';
                document.getElementById('p-category').value = p.category || '';
                document.getElementById('p-stock').value = p.stock;
                document.getElementById('p-sizes').value = (p.sizes || []).join(', ');
                document.getElementById('p-colors').value = (p.colors || []).join(', ');

                // Load existing images
                productImages = p.images || [];
                renderImagesGallery();

                document.getElementById('product-modal').classList.add('active');
            } catch (error) { showToast('Lỗi: ' + (error.message || 'Không tải được sản phẩm'), 'error'); console.error('Edit product error:', error); }
        }

        async function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('product-id').value;
            const data = {
                name: document.getElementById('p-name').value,
                description: document.getElementById('p-desc').value,
                price: parseFloat(document.getElementById('p-price').value),
                image: document.getElementById('p-image').value,
                images: productImages.map(img => ({ url: img.url, fileId: img.fileId })),
                category: document.getElementById('p-category').value,
                stock: parseInt(document.getElementById('p-stock').value) || 0,
                sizes: document.getElementById('p-sizes').value.split(',').map(s => s.trim()).filter(Boolean),
                colors: document.getElementById('p-colors').value.split(',').map(s => s.trim()).filter(Boolean)
            };

            try {
                if (id) await productsAPI.update(id, data);
                else await productsAPI.create(data);
                showToast('Lưu thành công', 'success');
                closeModal();
                loadProducts();
            } catch (error) { showToast('Lỗi lưu SP: ' + (error.message || 'Vui lòng thử lại'), 'error'); console.error('Save product error:', error); }
        }

        async function deleteProduct(id) {
            if (!confirm('Xóa sản phẩm này?')) return;
            try {
                await productsAPI.delete(id);
                showToast('Đã xóa', 'success');
                loadProducts();
            } catch (error) { showToast(error.message, 'error'); }
        }

        function closeModal() { document.getElementById('product-modal').classList.remove('active'); }

        // Image upload to ImageKit
        async function uploadImage(input) {
            if (!input.files || !input.files[0]) return;

            const file = input.files[0];
            const btn = document.getElementById('upload-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang tải...';
            btn.disabled = true;

            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('/api/admin/upload', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` },
                    body: formData
                });

                const data = await response.json();
                if (data.url) {
                    document.getElementById('p-image').value = data.url;
                    document.getElementById('p-image-preview').src = data.url;
                    showToast('Tải ảnh thành công!', 'success');
                } else {
                    throw new Error(data.error || 'Upload failed');
                }
            } catch (error) {
                showToast('Lỗi tải ảnh: ' + error.message, 'error');
            } finally {
                btn.innerHTML = '<i class="fas fa-upload"></i> Tải ảnh lên';
                btn.disabled = false;
            }
        }

        function previewUrl(url) {
            if (url) document.getElementById('p-image-preview').src = url;
        }

        // Multiple images functionality
        let productImages = [];

        async function uploadMultipleImages(input) {
            if (!input.files || input.files.length === 0) return;

            const btn = document.getElementById('upload-multiple-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang tải...';
            btn.disabled = true;

            const formData = new FormData();
            Array.from(input.files).forEach(file => {
                formData.append('images', file);
            });

            try {
                const response = await fetch('/api/admin/upload-multiple', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` },
                    body: formData
                });

                const data = await response.json();
                if (data.success && data.images) {
                    productImages = [...productImages, ...data.images];
                    renderImagesGallery();
                    showToast(`Đã tải ${data.images.length} ảnh thành công!`, 'success');
                } else {
                    throw new Error(data.error || 'Upload failed');
                }
            } catch (error) {
                showToast('Lỗi tải ảnh: ' + error.message, 'error');
            } finally {
                btn.innerHTML = '<i class="fas fa-images"></i> Tải nhiều ảnh';
                btn.disabled = false;
                input.value = ''; // Reset input
            }
        }

        function renderImagesGallery() {
            const gallery = document.getElementById('images-gallery');
            gallery.innerHTML = productImages.map((img, index) => `
                <div class="image-item" style="position:relative;display:inline-block;margin:0.5rem">
                    <img src="${img.url}" style="width:100px;height:100px;object-fit:cover;border-radius:8px;border:2px solid #ddd">
                    <button type="button" onclick="removeImage(${index})" 
                            style="position:absolute;top:-8px;right:-8px;background:var(--danger);color:white;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:12px">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `).join('');
        }

        async function removeImage(index) {
            const image = productImages[index];
            try {
                // Delete from ImageKit if it has fileId
                if (image.fileId) {
                    await fetch(`/api/admin/delete-image/${image.fileId}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                    });
                }
                productImages.splice(index, 1);
                renderImagesGallery();
                showToast('Đã xóa ảnh', 'success');
            } catch (error) {
                showToast('Lỗi xóa ảnh: ' + error.message, 'error');
            }
        }

        function closeModal() {
            document.getElementById('product-modal').classList.remove('active');
            productImages = []; // Reset images when closing modal
        }
        function closeDeleteModal() { document.getElementById('delete-modal').classList.remove('active'); }

        document.addEventListener('DOMContentLoaded', loadProducts);
        function toggleSidebar() {
            document.getElementById('admin-sidebar').classList.toggle('active');
            document.querySelector('.sidebar-overlay').classList.toggle('active');
        }
    </script>
    <script src="/js/push-client.js?v=4"></script>
</body>

</html>
```
