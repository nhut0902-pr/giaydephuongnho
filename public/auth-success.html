    <!-- Script tính toán đường vẽ SVG tự động -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const paths = document.querySelectorAll('.icon-part');
            paths.forEach(path => {
                let length = 0;
                if (path.tagName.toLowerCase() === 'path') {
                    length = path.getTotalLength();
                } else if (path.tagName.toLowerCase() === 'circle') {
                    const r = path.getAttribute('r');
                    length = 2 * Math.PI * r;
                } else if (path.tagName.toLowerCase() === 'line') {
                    const x1 = path.getAttribute('x1');
                    const y1 = path.getAttribute('y1');
                    const x2 = path.getAttribute('x2');
                    const y2 = path.getAttribute('y2');
                    length = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
                } else if (path.tagName.toLowerCase() === 'rect') {
                    const w = path.getAttribute('width');
                    const h = path.getAttribute('height');
                    length = (w * 2) + (h * 2);
                }
                const totalLength = length + 5;
                path.style.setProperty('--path-length', totalLength);
            });
        });
    </script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const user = params.get('user');
        if (token && user) {
            localStorage.setItem('token', token);
            localStorage.setItem('user', user);
            setTimeout(() => { window.location.href = '/'; }, 1500);
        } else {
            window.location.href = '/login.html';
        }
    </script>
