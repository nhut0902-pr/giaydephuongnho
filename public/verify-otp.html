<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực OTP - Giày dép Hương Nhớ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAF8EE;
            color: #1A1135;
            overflow-x: hidden;
        }

        .draw-path {
            stroke-dasharray: 1200;
            stroke-dashoffset: 0;
        }

        .animate-active .draw-path {
            animation: electricDraw 2.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        @keyframes electricDraw {
            0% {
                stroke-dashoffset: 1200;
                filter: brightness(2.5) drop-shadow(0 0 5px #A948C8);
                stroke-width: 8;
            }

            30% {
                stroke-dashoffset: 600;
                filter: brightness(1.8);
                stroke-width: 6;
            }

            100% {
                stroke-dashoffset: 0;
                filter: brightness(1);
                stroke-width: 4;
            }
        }

        .stagger-1 {
            animation-delay: 0s;
        }

        .stagger-2 {
            animation-delay: 0.2s;
        }

        .stagger-3 {
            animation-delay: 0.4s;
        }

        .stagger-4 {
            animation-delay: 0.6s;
        }

        .stagger-5 {
            animation-delay: 0.8s;
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-gradient {
            background: linear-gradient(135deg, #A948C8 0%, #4B61B5 100%);
        }

        .otp-input {
            width: 52px;
            height: 64px;
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            background: #f9fafb;
            border: 2px solid transparent;
            border-radius: 16px;
            outline: none;
            transition: all 0.3s;
            caret-color: #A948C8;
        }

        .otp-input:focus {
            border-color: #A948C8;
            background: white;
            box-shadow: 0 10px 25px -5px rgba(169, 72, 200, 0.15);
        }

        .otp-input.filled {
            border-color: #4B61B5;
            background: white;
        }

        .hidden-form {
            display: none;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .toast {
            padding: 12px 20px;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            animation: fadeIn 0.3s ease-out;
        }

        .toast.error {
            background: #ef4444;
        }

        .toast.success {
            background: #22c55e;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 relative">

    <div id="main-card"
        class="relative w-full max-w-md bg-white rounded-[3rem] shadow-[0_40px_120px_rgba(26,17,53,0.1)] overflow-hidden border border-white/50 transition-all duration-700">

        <!-- Logo Section -->
        <div class="pt-12 pb-4 flex flex-col items-center relative z-20">
            <div id="logo-container" class="w-44 h-40 cursor-pointer active:scale-95 transition-transform">
                <svg width="100%" height="100%" viewBox="0 0 160 140" id="logo-svg">
                    <defs>
                        <linearGradient id="premiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#A948C8" />
                            <stop offset="100%" stop-color="#4B61B5" />
                        </linearGradient>
                    </defs>
                    <g transform="translate(10, 10)" fill="none" stroke="url(#premiumGrad)" stroke-width="4"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line class="draw-path stagger-1" x1="0" y1="120" x2="140" y2="120" />
                        <rect class="draw-path stagger-2" x="10" y="32" width="120" height="88" rx="2" />
                        <rect class="draw-path stagger-1" x="6" y="24" width="128" height="8" rx="1" />
                        <path class="draw-path stagger-3"
                            d="M 10 32 A 7.5 7.5 0 0 0 25 32 A 7.5 7.5 0 0 0 40 32 A 7.5 7.5 0 0 0 55 32 A 7.5 7.5 0 0 0 70 32 A 7.5 7.5 0 0 0 85 32 A 7.5 7.5 0 0 0 100 32 A 7.5 7.5 0 0 0 115 32 A 7.5 7.5 0 0 0 130 32" />
                        <rect class="draw-path stagger-4" x="18" y="48" width="28" height="72" />
                        <line class="draw-path stagger-5" x1="18" y1="65" x2="46" y2="65" stroke-width="2" />
                        <rect class="draw-path stagger-4" x="55" y="48" width="65" height="72" />
                        <rect class="draw-path stagger-5" x="62" y="55" width="51" height="58" stroke-width="2" />
                        <g transform="translate(68, 62)">
                            <path class="draw-path stagger-5" d="M 38 40 L 38 15 L 22 15 L 22 25 Q 15 25 2 35 L 2 40 Z"
                                stroke-width="3" />
                            <line class="draw-path stagger-5" x1="-2" y1="45" x2="44" y2="45" stroke-width="2" />
                        </g>
                    </g>
                </svg>
            </div>
            <div class="text-center mt-4">
                <h1 class="text-2xl font-black tracking-[0.15em] text-[#1A1135] uppercase italic">Giày dép Hương Nhớ
                </h1>
                <div class="h-1 w-12 bg-gradient-to-r from-[#A948C8] to-[#4B61B5] mx-auto mt-2 rounded-full"></div>
            </div>
        </div>

        <!-- OTP Form -->
        <div class="px-10 pb-12 pt-4" id="form-container">

            <!-- OTP View -->
            <div id="view-otp" class="fade-in space-y-6">
                <div class="text-center space-y-2">
                    <div class="w-16 h-16 bg-purple-50 rounded-full flex items-center justify-center mx-auto mb-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                            stroke="#A948C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </div>
                    <h2 class="text-xl font-bold text-gray-800">Xác thực Email</h2>
                    <p class="text-xs text-gray-400 font-medium">Chúng tôi đã gửi mã 6 số tới</p>
                    <p class="text-sm font-bold text-[#A948C8]" id="display-email">email@example.com</p>
                </div>

                <form onsubmit="handleVerifyOTP(event)" class="space-y-6">
                    <div class="flex justify-center gap-3" id="otp-inputs">
                        <input type="text" maxlength="1" class="otp-input" data-index="0" inputmode="numeric"
                            pattern="[0-9]*" autocomplete="one-time-code">
                        <input type="text" maxlength="1" class="otp-input" data-index="1" inputmode="numeric"
                            pattern="[0-9]*">
                        <input type="text" maxlength="1" class="otp-input" data-index="2" inputmode="numeric"
                            pattern="[0-9]*">
                        <input type="text" maxlength="1" class="otp-input" data-index="3" inputmode="numeric"
                            pattern="[0-9]*">
                        <input type="text" maxlength="1" class="otp-input" data-index="4" inputmode="numeric"
                            pattern="[0-9]*">
                        <input type="text" maxlength="1" class="otp-input" data-index="5" inputmode="numeric"
                            pattern="[0-9]*">
                    </div>

                    <button type="submit" id="verify-btn"
                        class="btn-gradient w-full py-4 text-white font-black rounded-2xl shadow-lg shadow-purple-100 hover:shadow-purple-200 active:scale-95 transition-all tracking-widest text-sm">
                        XÁC THỰC
                    </button>
                </form>

                <div class="text-center space-y-3">
                    <p class="text-xs text-gray-400">
                        Không nhận được mã?
                        <button type="button" onclick="handleResendOTP()" id="resend-btn"
                            class="text-[#A948C8] font-black hover:underline ml-1">
                            Gửi lại mã
                        </button>
                        <span id="resend-timer" class="text-gray-300 font-bold ml-1 hidden">(60s)</span>
                    </p>
                    <a href="/login.html"
                        class="inline-block text-xs font-bold text-gray-400 hover:text-[#4B61B5] transition-colors">
                        &larr; Quay lại đăng nhập
                    </a>
                </div>
            </div>

            <!-- Success View -->
            <div id="view-success" class="fade-in hidden-form text-center py-8">
                <div
                    class="w-24 h-24 bg-green-50 text-green-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner animate-bounce">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <h3 class="text-2xl font-bold text-gray-800">Tuyệt vời!</h3>
                <p class="text-gray-400 mt-2 italic px-4">Xác thực thành công! Đang đưa bạn vào không gian mua sắm...
                </p>
            </div>
        </div>
    </div>

    <div class="absolute bottom-6 left-0 right-0 text-center">
        <p class="text-[10px] font-black tracking-widest text-gray-400 uppercase">
            Viết mã bởi <span
                class="bg-gradient-to-r from-[#A948C8] to-[#4B61B5] text-transparent bg-clip-text text-[11px]">Nhutcoder</span>
        </p>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="js/api.js?v=5"></script>
    <script>
        const logoSvg = document.getElementById('logo-svg');
        const params = new URLSearchParams(window.location.search);
        const userEmail = params.get('email') || '';

        document.getElementById('display-email').textContent = userEmail;

        // Logo animation
        function triggerLogoAnimation() {
            logoSvg.classList.remove('animate-active');
            void logoSvg.offsetWidth;
            logoSvg.classList.add('animate-active');
            setTimeout(() => logoSvg.classList.remove('animate-active'), 3000);
        }

        window.onload = () => {
            triggerLogoAnimation();
            // Focus first input
            document.querySelector('.otp-input').focus();
            startResendCooldown();
        };
        document.getElementById('logo-container').addEventListener('click', triggerLogoAnimation);

        // OTP input auto-advance logic
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, idx) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value.replace(/[^0-9]/g, '');
                e.target.value = val;
                if (val && idx < 5) {
                    inputs[idx + 1].focus();
                }
                e.target.classList.toggle('filled', !!val);
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && idx > 0) {
                    inputs[idx - 1].focus();
                    inputs[idx - 1].value = '';
                    inputs[idx - 1].classList.remove('filled');
                }
            });
            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasted = (e.clipboardData.getData('text') || '').replace(/[^0-9]/g, '').slice(0, 6);
                pasted.split('').forEach((char, i) => {
                    if (inputs[i]) {
                        inputs[i].value = char;
                        inputs[i].classList.add('filled');
                    }
                });
                if (pasted.length > 0) {
                    inputs[Math.min(pasted.length, 5)].focus();
                }
            });
        });

        function getOTPValue() {
            return Array.from(inputs).map(i => i.value).join('');
        }

        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        // Verify OTP
        async function handleVerifyOTP(e) {
            e.preventDefault();
            const otp = getOTPValue();
            if (otp.length !== 6) {
                showToast('Vui lòng nhập đủ 6 số!');
                return;
            }

            const btn = document.getElementById('verify-btn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            triggerLogoAnimation();

            try {
                const resp = await fetch(`${API_URL}/auth/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, otp })
                });
                const data = await resp.json();

                if (!resp.ok) {
                    throw new Error(data.error || 'Xác thực thất bại');
                }

                // Save token and user
                if (data.token) localStorage.setItem('token', data.token);
                if (data.user) localStorage.setItem('user', JSON.stringify(data.user));

                // Show success
                document.getElementById('view-otp').classList.add('hidden-form');
                document.getElementById('view-success').classList.remove('hidden-form');

                setTimeout(() => { window.location.href = '/'; }, 2000);
            } catch (err) {
                showToast(err.message);
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // Resend OTP with cooldown
        let resendCooldown = 0;
        let resendInterval = null;

        function startResendCooldown() {
            resendCooldown = 60;
            const btn = document.getElementById('resend-btn');
            const timer = document.getElementById('resend-timer');
            btn.disabled = true;
            btn.style.opacity = '0.4';
            timer.classList.remove('hidden');

            resendInterval = setInterval(() => {
                resendCooldown--;
                timer.textContent = `(${resendCooldown}s)`;
                if (resendCooldown <= 0) {
                    clearInterval(resendInterval);
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    timer.classList.add('hidden');
                }
            }, 1000);
        }

        async function handleResendOTP() {
            if (resendCooldown > 0) return;

            try {
                const resp = await fetch(`${API_URL}/auth/resend-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });
                const data = await resp.json();

                if (!resp.ok) {
                    throw new Error(data.error || 'Gửi lại thất bại');
                }

                showToast('Đã gửi lại mã OTP! Kiểm tra email.', 'success');
                startResendCooldown();
                triggerLogoAnimation();

                // Clear inputs
                inputs.forEach(i => { i.value = ''; i.classList.remove('filled'); });
                inputs[0].focus();
            } catch (err) {
                showToast(err.message);
            }
        }
    </script>
</body>

</html>
